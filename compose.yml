services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commerce
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck: {test: ["CMD-SHELL", "mysqladmin ping -h localhost -ucommerce -pcommerce"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server","--appendonly","yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 20}
  mongo:
    image: mongo:8.0
    environment: {MONGO_INITDB_ROOT_USERNAME: commerce, MONGO_INITDB_ROOT_PASSWORD: commerce}
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck: {test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping').ok"], interval: 5s, timeout: 3s, retries: 20}
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck: {test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 10s, timeout: 5s, retries: 20}
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/commerce?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: commerce
      DB_PASSWORD: commerce
      REDIS_HOST: redis
      MONGODB_URI: mongodb://commerce:commerce@mongo:27017/logistics?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}
      kafka: {condition: service_healthy}
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"], interval: 10s, timeout: 5s, retries: 20}
volumes: {mysql-data: {}, redis-data: {}, mongo-data: {}}

